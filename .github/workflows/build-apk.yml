name: Build Attendance Tracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q AttendanceTrackerPro_Kotlin_Phase1.zip -d extracted
          ls -la extracted/AttendanceTrackerKotlin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p extracted/AttendanceTrackerKotlin assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-Tracker-Debug-APK
          path: extracted/AttendanceTrackerKotlin/app/build/outputs/apk/debug/app-debug.apk
